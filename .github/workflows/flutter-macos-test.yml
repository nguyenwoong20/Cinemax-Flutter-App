name: Flutter macOS Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.dart'
      - 'pubspec.*'
      - '.github/workflows/flutter-macos-test.yml'
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios-test:
    needs: lint-and-unit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
